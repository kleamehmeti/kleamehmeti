<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Klea Mehmeti: Computer Engineering</title>
  <desc id="d">An integrated circuit on a circuit board. The chip reads Klea Mehmeti, Computer Engineering, embedded, systems and web. Its twelve pins are C, C++, C#, Python, Java, JavaScript, PHP, HTML, CSS, Linux, Arduino and Raspberry Pi.</desc>
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .pin{font-size:15px;font-weight:700;fill:#F1F5F9;letter-spacing:1px}
      .num{font-size:10px;fill:#6B7280}
      .l{animation:left 2.6s linear infinite}
      .r{animation:right 2.6s linear infinite}
      @keyframes left{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(-136px);opacity:0}}
      @keyframes right{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(136px);opacity:0}}
      .led{animation:led 1.6s steps(1) infinite}
      @keyframes led{50%{fill:#14532D}}
      .cur{animation:cur 1s steps(1) infinite}
      @keyframes cur{50%{opacity:0}}
    </style>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#FFFFFF" opacity=".05"/>
    </pattern>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2229"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
  </defs>

  <!-- board -->
  <rect width="1200" height="470" rx="18" fill="#0C1A14"/>
  <rect width="1200" height="470" rx="18" fill="url(#dots)"/>
  <rect x="12" y="12" width="1176" height="446" rx="12" fill="none" stroke="#1E3A2E" stroke-width="2"/>

  <!-- mounting holes -->
  <g fill="#0C1A14" stroke="#C9A24B" stroke-width="3">
    <circle cx="44" cy="44" r="9"/><circle cx="1156" cy="44" r="9"/>
    <circle cx="44" cy="426" r="9"/><circle cx="1156" cy="426" r="9"/>
  </g>

  <!-- silkscreen -->
  <g class="mono" fill="#CBD5E1">
    <text x="70" y="50" font-size="13" opacity=".6">Tirana, Albania</text>
    <text x="1130" y="50" font-size="13" opacity=".6" text-anchor="end">github.com/kleamehmeti</text>
  </g>

  <!-- decorative background traces -->
  <g fill="none" stroke="#1E3A2E" stroke-width="3" stroke-linecap="round">
    <path d="M70 400 H300 L330 430 H520"/>
    <path d="M700 430 H880 L910 400 H1130"/>
    <path d="M520 78 H680"/>
  </g>

  <!-- left traces and pads -->
  <g stroke="#C9A24B" stroke-width="3" fill="none">
    <path d="M352 135 H214"/><path d="M352 177 H214"/><path d="M352 219 H214"/>
    <path d="M352 261 H214"/><path d="M352 303 H214"/><path d="M352 345 H214"/>
    <path d="M848 135 H986"/><path d="M848 177 H986"/><path d="M848 219 H986"/>
    <path d="M848 261 H986"/><path d="M848 303 H986"/><path d="M848 345 H986"/>
  </g>
  <g fill="#0C1A14" stroke="#C9A24B" stroke-width="3">
    <circle cx="208" cy="135" r="6"/><circle cx="208" cy="177" r="6"/><circle cx="208" cy="219" r="6"/>
    <circle cx="208" cy="261" r="6"/><circle cx="208" cy="303" r="6"/><circle cx="208" cy="345" r="6"/>
    <circle cx="992" cy="135" r="6"/><circle cx="992" cy="177" r="6"/><circle cx="992" cy="219" r="6"/>
    <circle cx="992" cy="261" r="6"/><circle cx="992" cy="303" r="6"/><circle cx="992" cy="345" r="6"/>
  </g>

  <!-- signal pulses -->
  <g fill="#5EEAD4">
    <circle class="l" cx="350" cy="135" r="3.5"/>
    <circle class="l" cx="350" cy="177" r="3.5" style="animation-delay:.9s"/>
    <circle class="l" cx="350" cy="219" r="3.5" style="animation-delay:1.7s"/>
    <circle class="l" cx="350" cy="261" r="3.5" style="animation-delay:.4s"/>
    <circle class="l" cx="350" cy="303" r="3.5" style="animation-delay:1.3s"/>
    <circle class="l" cx="350" cy="345" r="3.5" style="animation-delay:2.1s"/>
    <circle class="r" cx="850" cy="135" r="3.5" style="animation-delay:1.1s"/>
    <circle class="r" cx="850" cy="177" r="3.5" style="animation-delay:.2s"/>
    <circle class="r" cx="850" cy="219" r="3.5" style="animation-delay:1.9s"/>
    <circle class="r" cx="850" cy="261" r="3.5" style="animation-delay:.7s"/>
    <circle class="r" cx="850" cy="303" r="3.5" style="animation-delay:1.5s"/>
    <circle class="r" cx="850" cy="345" r="3.5" style="animation-delay:2.3s"/>
  </g>

  <!-- pin labels -->
  <g class="mono pin" text-anchor="end">
    <text x="192" y="140">C</text><text x="192" y="182">C++</text><text x="192" y="224">C#</text>
    <text x="192" y="266">PYTHON</text><text x="192" y="308">JAVA</text><text x="192" y="350">JAVASCRIPT</text>
  </g>
  <g class="mono pin">
    <text x="1008" y="140">RASPBERRY PI</text><text x="1008" y="182">ARDUINO</text><text x="1008" y="224">LINUX</text>
    <text x="1008" y="266">CSS</text><text x="1008" y="308">HTML</text><text x="1008" y="350">PHP</text>
  </g>

  <!-- chip legs -->
  <g fill="#D6D9DE">
    <rect x="352" y="128" width="30" height="14" rx="2"/><rect x="352" y="170" width="30" height="14" rx="2"/>
    <rect x="352" y="212" width="30" height="14" rx="2"/><rect x="352" y="254" width="30" height="14" rx="2"/>
    <rect x="352" y="296" width="30" height="14" rx="2"/><rect x="352" y="338" width="30" height="14" rx="2"/>
    <rect x="818" y="128" width="30" height="14" rx="2"/><rect x="818" y="170" width="30" height="14" rx="2"/>
    <rect x="818" y="212" width="30" height="14" rx="2"/><rect x="818" y="254" width="30" height="14" rx="2"/>
    <rect x="818" y="296" width="30" height="14" rx="2"/><rect x="818" y="338" width="30" height="14" rx="2"/>
  </g>

  <!-- chip body -->
  <rect x="372" y="104" width="456" height="272" rx="10" fill="url(#die)" stroke="#2D323C" stroke-width="2"/>
  <circle cx="400" cy="132" r="7" fill="#0A0B0E"/>
  <path d="M580 104 a20 20 0 0 0 40 0" fill="#0A0B0E"/>

  <g class="mono num">
    <text x="392" y="182">2</text><text x="392" y="224">3</text>
    <text x="392" y="266">4</text><text x="392" y="308">5</text><text x="392" y="350">6</text>
    <text x="808" y="140" text-anchor="end">12</text><text x="808" y="182" text-anchor="end">11</text>
    <text x="808" y="224" text-anchor="end">10</text><text x="808" y="266" text-anchor="end">9</text>
    <text x="808" y="308" text-anchor="end">8</text><text x="808" y="350" text-anchor="end">7</text>
  </g>

  <text x="600" y="214" class="sans" font-size="44" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="3">KLEA MEHMETI</text>
  <text x="600" y="252" class="mono" font-size="16" fill="#9CA3AF" text-anchor="middle">Computer Engineering</text>
  <line x1="450" y1="280" x2="750" y2="280" stroke="#2D323C"/>
  <text x="600" y="314" class="mono" font-size="15" fill="#5EEAD4" text-anchor="middle">embedded · systems · web</text>

  <!-- status LED -->
  <circle class="led" cx="778" cy="124" r="4" fill="#4ADE80"/>

  <!-- tagline -->
  <text x="600" y="432" class="mono" font-size="16" fill="#E5E7EB" text-anchor="middle">From microcontroller firmware to the web page it reports to.</text>
</svg>
