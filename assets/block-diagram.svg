<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Functional block diagram: the stack from hardware to browser</title>
  <desc id="d">Five blocks joined by data buses. Sensors and I/O (circuits, prototyping) connect over GPIO to a microcontroller (Arduino, C and C++), over UART to a single-board computer (Raspberry Pi, Linux, Python), over HTTP to a back end (PHP, Java, databases), and over JSON to a front end (HTML, CSS, JavaScript).</desc>
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .ttl{font-size:15px;font-weight:800;fill:#F8FAFC;letter-spacing:1.5px}
      .sub{font-size:12.5px;fill:#CBD5E1}
      .tag{font-size:11px;fill:#94A3B8}
      .bus{stroke-dasharray:6 6;animation:flow 1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-12}}
      .busl{font-size:10.5px;font-weight:700;fill:#5EEAD4}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5EEAD4"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#0C1A14"/>
  <text x="24" y="34" class="mono" font-size="12" font-weight="700" fill="#C9A24B" letter-spacing="1.5">STACK</text>
  <text x="1176" y="34" class="mono" font-size="12" fill="#64748B" text-anchor="end">signal path: sensor → screen</text>

  <!-- domain bands -->
  <g class="mono" font-size="11" font-weight="700" letter-spacing="2">
    <rect x="20" y="58" width="440" height="20" rx="4" fill="#C9A24B" fill-opacity=".14"/>
    <text x="240" y="72" fill="#C9A24B" text-anchor="middle">EMBEDDED</text>
    <rect x="500" y="58" width="200" height="20" rx="4" fill="#5EEAD4" fill-opacity=".12"/>
    <text x="600" y="72" fill="#5EEAD4" text-anchor="middle">SYSTEMS</text>
    <rect x="740" y="58" width="440" height="20" rx="4" fill="#A78BFA" fill-opacity=".14"/>
    <text x="960" y="72" fill="#A78BFA" text-anchor="middle">WEB</text>
  </g>

  <!-- blocks -->
  <g stroke-width="2">
    <rect x="20" y="96" width="200" height="132" rx="10" fill="#111C17" stroke="#C9A24B"/>
    <rect x="260" y="96" width="200" height="132" rx="10" fill="#111C17" stroke="#C9A24B"/>
    <rect x="500" y="96" width="200" height="132" rx="10" fill="#111C17" stroke="#5EEAD4"/>
    <rect x="740" y="96" width="200" height="132" rx="10" fill="#111C17" stroke="#A78BFA"/>
    <rect x="980" y="96" width="200" height="132" rx="10" fill="#111C17" stroke="#A78BFA"/>
  </g>

  <g class="mono">
    <text x="120" y="134" class="ttl" text-anchor="middle">I/O</text>
    <text x="120" y="160" class="sub" text-anchor="middle">sensors · actuators</text>
    <text x="120" y="180" class="sub" text-anchor="middle">circuit prototyping</text>
    <text x="120" y="210" class="tag" text-anchor="middle">electronics · digital design</text>

    <text x="360" y="134" class="ttl" text-anchor="middle">MCU</text>
    <text x="360" y="160" class="sub" text-anchor="middle">Arduino</text>
    <text x="360" y="180" class="sub" text-anchor="middle">C · C++</text>
    <text x="360" y="210" class="tag" text-anchor="middle">firmware · real-time loops</text>

    <text x="600" y="134" class="ttl" text-anchor="middle">SBC</text>
    <text x="600" y="160" class="sub" text-anchor="middle">Raspberry Pi</text>
    <text x="600" y="180" class="sub" text-anchor="middle">Linux · Python</text>
    <text x="600" y="210" class="tag" text-anchor="middle">scripting · automation</text>

    <text x="840" y="134" class="ttl" text-anchor="middle">BACK END</text>
    <text x="840" y="160" class="sub" text-anchor="middle">PHP · Java · C#</text>
    <text x="840" y="180" class="sub" text-anchor="middle">databases</text>
    <text x="840" y="210" class="tag" text-anchor="middle">OOP · data modelling</text>

    <text x="1080" y="134" class="ttl" text-anchor="middle">FRONT END</text>
    <text x="1080" y="160" class="sub" text-anchor="middle">HTML · CSS</text>
    <text x="1080" y="180" class="sub" text-anchor="middle">JavaScript</text>
    <text x="1080" y="210" class="tag" text-anchor="middle">interactive UIs</text>
  </g>

  <!-- buses -->
  <g stroke="#5EEAD4" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path class="bus" d="M222 162 H256"/>
    <path class="bus" d="M462 162 H496"/>
    <path class="bus" d="M702 162 H736"/>
    <path class="bus" d="M942 162 H976"/>
  </g>
  <g class="mono busl" text-anchor="middle">
    <text x="240" y="150">GPIO</text>
    <text x="480" y="150">UART</text>
    <text x="720" y="150">HTTP</text>
    <text x="960" y="150">JSON</text>
  </g>

  <text x="600" y="270" class="mono" font-size="12.5" fill="#94A3B8" text-anchor="middle">Layers I work across in robotics and web projects.</text>
</svg>
